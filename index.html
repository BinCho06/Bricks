<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script defer="" type="text/javascript" src="js/script.js"></script>
    <script defer="" type="text/javascript" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Bricks-Game</title>
</head>
<body>
    <h1>Bricks Game</h1>
    <div id="content">
        <div>
            <p id="score">Score: 0</p>
            <div id="lives">
            </div>
        </div>
        <canvas id="canvas" width="1000px" height="1000px"></canvas>
        <button id="play" onclick="pauseGame()">Play</button>
        <div>
            <button id="leaderboard" onclick="displayScores()"><i class="fas fa-trophy"></i></button>
            <button id="info" onclick="info()"><i class="fas fa-info-circle"></i></button>
        </div>
    </div>
    <div id="background-wrapper">
        <div id="background">
            <img src="img/ground.png" alt="ground">
        </div>
        <div id="credits" onclick="credits()"></div>
    </div>
    <div id="ground"></div>
</body>
</html>
